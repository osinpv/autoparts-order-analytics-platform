services:
  db:
    image: postgres:17
    container_name: autoparts_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoparts_user
      POSTGRES_PASSWORD: autoparts_pass
      POSTGRES_DB: autoparts_db
    ports:
      - "5432:5432"
    volumes:
      - autoparts_pg_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8
    container_name: autoparts-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: autoparts_mongo_user
      MONGO_INITDB_ROOT_PASSWORD: autoparts_mongo_password
      MONGO_INITDB_DATABASE: autoparts_docs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro

volumes:
  autoparts_pg_data:
  mongodb_data: